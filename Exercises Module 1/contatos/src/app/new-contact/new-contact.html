<form action="">
    <p>
        <label for="name">Name: </label>
        <input type="text" name="name" [(ngModel)]="enteredName">
    </p>

    <p>
        <label for="email">Email: </label>
        <input type="text" name="email" [(ngModel)]="enteredEmail">
    </p>

    <p>
        <label for="phone">Phone: </label>
        <input type="tel" name="phone" [(ngModel)]="enteredPhone">
    </p>

    <button type="submit" [disabled]="someFieldEmpty" (click)="onSubmitForm()">Adicionar contato</button>
</form>
